# =============================================================================
# WORKFLOW: PR Validation con DLCO QA Agent (v1.1)
# =============================================================================
# Trigger: PR contra la rama main
# Acción:  Invoca el agente PySpark Validator sobre archivos de PIPELINES
#          (no sobre notebooks del propio agente DLCO).
#
# CAMBIOS v1.1 (vs v1.0):
# - Filtro de paths más estricto: solo notebooks/pipelines/** y src/**
# - EXCLUYE notebooks/setup/** (son del propio agente, no requieren validación)
# - EXCLUYE notebooks/ci/** (idem)
# - Esto evita exceder el límite de 10KB en job_parameters de Databricks
#
# ROADMAP v2.0:
# - Subir archivos grandes a Volume UC y pasar solo paths al job
#   (permitirá validar archivos de cualquier tamaño)
# =============================================================================

name: DLCO QA - PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      # Solo validamos archivos de PIPELINES de datos, no del propio agente
      - "notebooks/test_pipelines/**/*.py"
      - "notebooks/pipelines/**/*.py"
      - "notebooks/ingestion/**/*.py"
      - "notebooks/transform/**/*.py"
      - "src/**/*.py"

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: 🤖 Validar código con DLCO QA Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sdk requests pyyaml

      - name: 🔍 Detectar archivos modificados
        id: changed-files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Filtros: solo pipelines de datos, NO notebooks del agente
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '\.py$' \
            | grep -vE '^(tests/|\.github/|notebooks/setup/|notebooks/ci/)' \
            || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "ℹ️ No hay archivos .py de pipelines modificados"
            echo "files_to_validate=" >> $GITHUB_OUTPUT
            echo "skip_validation=true" >> $GITHUB_OUTPUT
          else
            TOTAL_SIZE=$(echo "$CHANGED_FILES" | xargs -I {} wc -c {} 2>/dev/null | awk '{sum+=$1} END {print sum+0}')
            echo "📝 Archivos detectados (total: ${TOTAL_SIZE} bytes):"
            echo "$CHANGED_FILES"

            if [ "$TOTAL_SIZE" -gt 8000 ]; then
              echo "⚠️ ADVERTENCIA: Archivos suman ${TOTAL_SIZE} bytes (límite Databricks: ~10KB)"
            fi

            FILES_CSV=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
            echo "files_to_validate=$FILES_CSV" >> $GITHUB_OUTPUT
            echo "skip_validation=false" >> $GITHUB_OUTPUT
          fi

      - name: 🤖 Ejecutar agente DLCO QA en Databricks
        id: run-agent
        if: steps.changed-files.outputs.skip_validation != 'true'
        run: |
          python src/dlco_qa/ci_validator.py \
            --pr-id "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --files "${{ steps.changed-files.outputs.files_to_validate }}" \
            --output-file validation_result.json

      - name: 💬 Comentar findings en el PR
        if: steps.changed-files.outputs.skip_validation != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '';
            try {
              const result = JSON.parse(fs.readFileSync('validation_result.json', 'utf8'));

              const verdict = result.verdict || 'unknown';
              const score = result.quality_score || 0;
              const findings = result.findings || [];
              const critical = findings.filter(f => f.severity === 'CRITICAL').length;
              const high = findings.filter(f => f.severity === 'HIGH').length;
              const medium = findings.filter(f => f.severity === 'MEDIUM').length;
              const low = findings.filter(f => f.severity === 'LOW').length;

              const verdictIcon = verdict === 'approved' ? '✅' : '❌';
              const scoreBar = '█'.repeat(Math.floor(score/10)) + '░'.repeat(10 - Math.floor(score/10));

              comment = `## ${verdictIcon} DLCO QA Agent - Reporte de Validación

              | Métrica | Valor |
              |---------|-------|
              | **Veredicto** | ${verdict.toUpperCase()} |
              | **Quality Score** | \`${scoreBar}\` ${score}/100 |
              | **Total Findings** | ${findings.length} |
              | 🔴 Critical | ${critical} |
              | 🟠 High | ${high} |
              | 🟡 Medium | ${medium} |
              | 🟢 Low | ${low} |

              ### 📋 Findings Detallados
              `;

              if (findings.length === 0) {
                comment += `\n🎉 **No se encontraron problemas. ¡Excelente código!**\n`;
              } else {
                findings.slice(0, 20).forEach((f, i) => {
                  const icon = f.severity === 'CRITICAL' ? '🔴' :
                               f.severity === 'HIGH' ? '🟠' :
                               f.severity === 'MEDIUM' ? '🟡' : '🟢';
                  comment += `\n${i+1}. ${icon} **[${f.severity}]** \`${f.rule}\`\n   ${f.message}\n`;
                });
                if (findings.length > 20) {
                  comment += `\n_... y ${findings.length - 20} findings más._\n`;
                }
              }

              comment += `\n---\n_🤖 Generado por DLCO QA Agent v1.1 | Framework: DataOps Corp v1.1_`;
            } catch (err) {
              comment = `## ⚠️ DLCO QA Agent - Error\n\nNo se pudo procesar el resultado de validación.\n\n\`\`\`\n${err.message}\n\`\`\``;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('DLCO QA Agent - Reporte')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: 🚦 Evaluar veredicto del agente
        if: steps.changed-files.outputs.skip_validation != 'true'
        run: |
          python -c "
          import json, sys
          with open('validation_result.json') as f:
              result = json.load(f)
          findings = result.get('findings', [])
          critical = [f for f in findings if f.get('severity') == 'CRITICAL']
          if critical:
              print(f'❌ Se encontraron {len(critical)} findings CRITICAL. Bloqueando merge.')
              for f in critical:
                  print(f'   • [{f.get(\"rule\")}] {f.get(\"message\")}')
              sys.exit(1)
          print('✅ Sin findings CRITICAL. PR aprobado por el agente.')
          "

      - name: ℹ️ Skip validation message
        if: steps.changed-files.outputs.skip_validation == 'true'
        run: |
          {
            echo "## ℹ️ DLCO QA Agent"
            echo ""
            echo "No hay archivos \`.py\` de pipelines de datos modificados en este PR."
            echo ""
            echo "**Carpetas validadas:** notebooks/test_pipelines/, notebooks/pipelines/, src/"
            echo "**Carpetas excluidas (son del agente):** notebooks/setup/, notebooks/ci/"
          } >> $GITHUB_STEP_SUMMARY
